# Eval Agent settings (docs/tasks/06_eval.md). Loaded as cfg["eval"] by geoqc.config.load_config().
iou_threshold: 0.5            # a GT/detection pair counts as TP when IoU >= this value (CONTRACTS §4)
match_method: greedy          # greedy | hungarian  (1:1 matching of GT and detections)
min_area_m2: null             # min area of a detection fragment after clipping to split tiles; null -> annotation.min_area_m2, else 12
precision_at_n: [10, 20, 50]  # N values for Precision@N over verified discrepancies
gate_precision_at_n: 20       # N that feeds metrics.json -> discrepancies.precision_at_n (gate G7 = Precision@20)
sample_size: 50               # minimum size of the verification sample
per_class_min: 15             # minimum items per discrepancy class in the sample (when the class has that many)
seed: 42                      # seed of the random part of the sample
verdicts: [map_error, model_error, image_issue, unsure]
error_analysis:
  top_k_worst_tiles: 10
  n_example_figures: 6        # worst tiles rendered to reports/figures/
  iou_bins: 10                # histogram bins on [0, 1]
  area_bins_m2: [0, 25, 50, 100, 200, 500, 1000, 5000, 1000000]
  tile_border_buffer_m: 5.0   # an error is "at the tile border" when it lies within this distance of the tile edge
  convexity_threshold: 0.85   # GT with area / convex_hull_area below this is a "complex roof"
  shadow_luminance_quantile: 0.25   # FN darker than this quantile of TP luminance count as "in shadow"
  vegetation_exg_threshold: 20.0    # mean ExG = 2G - R - B (uint8 scale) above this counts as "vegetation"
